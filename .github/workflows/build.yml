name: Build Mango Energy Pro v3 Ultimate APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Capacitor, Notifications & Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/assets --save
          npx cap add android

      - name: 5. Generate Mango App Icons
        run: |
          npx capacitor-assets generate --android
          npx cap sync android

      - name: 6. Inject Android Permissions (Notifications, Foreground, Wakelock, Cleartext)
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: 7. Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangoEnergyPro-v3-Ultimate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
